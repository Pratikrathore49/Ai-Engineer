services:
    redis:
    image:redis:7-alpine
    container-name:chai-aur-redis
    posts:
        - "6379:6379"
        commnd:["radis-server","--appendonly","yes"]
        valumes:
        - redis-data:/data

mongo:
  image:mongo:7
  container_name: chai_aur_mongo
  ports:
   - "27017:27017"
   environment:
    MONGO_INITDB_DATABASE: chai_out_redis
    volumes:
      - mongo-data:/data/db

volumes:
    redis-data:
    mongo-data: